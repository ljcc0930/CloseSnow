<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="{{asset_prefix}}/js/theme.js"></script>
  <title>Resort Forecast</title>
  <link rel="stylesheet" href="{{asset_prefix}}/css/design_system.css" />
  <link rel="stylesheet" href="{{asset_prefix}}/css/resort_hourly.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="{{back_href}}" aria-label="CloseSnow home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 42 42" role="img"><path d="M4 31.5 14.3 17l5.1 6.7L27.1 11 38 31.5H4Z" /><path d="m14.3 17 3.1 4.1 2-2.4 3.3 4.7 4.4-12.4" /></svg>
        </span>
        <span class="brand-copy"><strong>CloseSnow</strong></span>
      </a>
      <div class="site-header-actions">
        <button type="button" class="theme-toggle" data-theme-toggle role="switch" aria-label="Day/night theme" aria-checked="false" title="Switch to night theme">
          <svg class="theme-icon-day" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4" /></svg>
          <svg class="theme-icon-night" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z" /></svg>
          <span class="theme-label-day">Day</span><span class="theme-label-night">Night</span>
        </button>
      </div>
    </div>
  </header>
  <main>
    <section class="resort-hero" aria-labelledby="hourly-title">
      <a class="back-link" href="{{back_href}}"><span aria-hidden="true">←</span> All resorts</a>
      <div class="resort-overview">
        <div class="resort-identity">
          <h1 id="hourly-title">Resort Forecast</h1>
          <div class="resort-identity-meta">
            <p id="resort-local-time" class="resort-local-time"></p>
            <p id="resort-website-link" class="resort-website-link"></p>
            <p id="resort-location-link" class="resort-location-link"></p>
          </div>
        </div>
        <div id="resort-snapshot" class="resort-snapshot" aria-label="Resort forecast overview"></div>
      </div>
    </section>
    <section class="hourly-workspace" aria-labelledby="hourly-section-title">
      <div class="hourly-workspace-heading">
        <div>
          <h2 id="hourly-section-title" class="hourly-section-title">Hourly outlook</h2>
        </div>
        <div class="hourly-controls">
          <label for="hours-select">Range</label>
          <select id="hours-select">
            <option value="24">24 hours</option>
            <option value="48">48 hours</option>
            <option value="72" selected>72 hours</option>
            <option value="120">120 hours</option>
          </select>
          <button id="hours-refresh-btn" type="button" aria-label="Refresh hourly forecast" title="Refresh hourly forecast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.5-1.5L20 8M4 16l2.4 2.5A7 7 0 0 0 17.9 17"/></svg><span class="hourly-refresh-label">Refresh</span></button>
        </div>
      </div>
      <p id="hourly-meta" class="hourly-meta">Loading...</p>
      <div id="hourly-error" class="hourly-error" hidden></div>
      <div id="hourly-chart-error" class="hourly-chart-error" hidden></div>
      <section id="hourly-charts" class="hourly-charts" aria-label="Explore the hourly forecast"></section>
      <details class="raw-data-panel">
        <summary>View hourly data</summary>
        <div class="table-wrap">
          <table id="hourly-table" class="hourly-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </details>
    </section>
    <section id="resort-timeline-section" class="resort-timeline-section" hidden>
      <div class="section-heading">
        <h2>Past 14 days + forecast</h2>
        <span>Scroll for more days · °C / cm / mm</span>
      </div>
      <div id="resort-timeline-root"></div>
    </section>
    <section id="resort-airport-access-section" class="resort-airport-access-section" hidden>
      <div class="section-heading">
        <h2>Nearby airports</h2>
        <span>Within 250 miles</span>
      </div>
      <div id="resort-airport-access-root"></div>
    </section>
  </main>
  <footer class="page-footer"><strong>CloseSnow</strong><span>Forecast by <a href="https://open-meteo.com/en/docs/ecmwf-api" target="_blank" rel="noopener noreferrer">Open-Meteo · ECMWF</a></span></footer>
  <script>
    window.CLOSESNOW_HOURLY_CONTEXT = {{hourly_context_json}};
  </script>
  <script src="{{asset_prefix}}/js/weather_code_emoji.js"></script>
  <script src="{{asset_prefix}}/js/weather_colors.js"></script>
  <script src="{{asset_prefix}}/js/compact_daily_summary.js"></script>
  <script src="{{asset_prefix}}/js/resort_hourly_metrics.js"></script>
  <script src="{{asset_prefix}}/js/hourly_explorer.js"></script>
  <script src="{{asset_prefix}}/js/resort_hourly.js"></script>
</body>
</html>
