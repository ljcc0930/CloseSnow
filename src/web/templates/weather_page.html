<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="assets/js/theme.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V9NBX3H6M9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-V9NBX3H6M9');
  </script>
  <title>CloseSnow · Mountain forecast</title>
  <meta name="description" content="Compare ski resort snowfall, temperature, and hourly weather. Find the forecast for your next mountain day." />
  <link rel="stylesheet" href="assets/css/design_system.css" />
  <link rel="stylesheet" href="assets/css/forecast_tables.css" />
  <link rel="stylesheet" href="assets/css/weather_page.css" />
</head>
<body class="units-pending">
  <a class="skip-link" href="#explore-title">Skip to forecast</a>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="./" aria-label="CloseSnow home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 42 42" role="img">
            <path d="M4 31.5 14.3 17l5.1 6.7L27.1 11 38 31.5H4Z" />
            <path d="m14.3 17 3.1 4.1 2-2.4 3.3 4.7 4.4-12.4" />
          </svg>
        </span>
        <span class="brand-copy">
          <strong>CloseSnow</strong>

        </span>
      </a>
      <div class="site-header-actions">
        <button type="button" class="theme-toggle" data-theme-toggle role="switch" aria-label="Day/night theme" aria-checked="false" title="Switch to night theme">
          <svg class="theme-icon-day" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4" /></svg>
          <svg class="theme-icon-night" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z" /></svg>
          <span class="theme-label-day">Day</span><span class="theme-label-night">Night</span>
        </button>
      </div>
    </div>
  </header>
  <main>
    <section class="forecast-heading" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">Mountain forecast</h1>
      </div>
      <div class="report-date">
        <div class="report-powered">Forecast by <a href="https://open-meteo.com/en/docs/ecmwf-api" target="_blank" rel="noopener noreferrer">Open-Meteo · ECMWF</a></div>
        <div id="report-date" class="report-generated" data-generated-utc="{{generated_utc_iso}}">Loading forecast time…</div>
      </div>
    </section>
    <section class="control-panel" aria-labelledby="explore-title">
      <div class="control-panel-heading">
        <div>
          <h2 id="explore-title" tabindex="-1">Explore resorts</h2>
        </div>
        <span id="filter-summary" class="filter-summary" role="status"></span>
      </div>
      <div class="resort-controls">
        <div class="resort-search">
          <label class="sr-only" for="resort-search-input">Search Resorts</label>
          <span class="search-field">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16.2 16.2 4.1 4.1"></path></svg>
            <input id="resort-search-input" type="search" placeholder="Search resort, region, or pass…" autocomplete="off" />
          </span>
          <button id="resort-search-clear" type="button">Clear</button>
        </div>
        <div class="resort-search-options" aria-label="Quick filters">
          <label class="resort-search-toggle">
            <input type="checkbox" id="filter-search-all" checked />
            <span>Search all resorts</span>
          </label>
          <label class="resort-search-toggle">
            <input type="checkbox" id="favorites-only-toggle" />
            <span>Favorites only</span>
          </label>
        </div>
        <div class="toolbar-sort">
          <label for="filter-sort-select">Sort by</label>
          <select id="filter-sort-select">
            <option value="state">State (A-Z)</option>
            <option value="name">Resort Name (A-Z)</option>
            <option value="favorites">Favorites First</option>
            <option value="today_snow">Today's Snowfall</option>
            <option value="week_snow" selected>This Week's Snowfall</option>
            <option value="next_week_snow">Next Week's Snowfall</option>
            <option value="two_week_snow">Two-Week Snowfall</option>
          </select>
        </div>
        <div class="resort-filter-bar">
          <button id="filter-open-btn" type="button" aria-haspopup="dialog" aria-controls="filter-modal" aria-expanded="false">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
            Filters
          </button>
        </div>
      </div>
    </section>
    <div id="filter-modal" class="filter-modal" hidden>
      <div class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title">
        <h3 id="filter-title">Filters</h3>
        <div class="filter-group">
          <label class="filter-include-all-label">
            <input type="checkbox" id="filter-include-all" checked />
            Default resorts only
          </label>
        </div>
        <div class="filter-group">
          <label class="filter-include-all-label">
            <input type="checkbox" id="filter-favorites-only" />
            Favorites only
          </label>
        </div>
        <div class="filter-group">
          <div class="filter-group-title">Pass Type</div>
          <label><input type="checkbox" name="filter-pass-type" value="ikon" /> Ikon <span data-pass-count="ikon"></span></label>
          <label><input type="checkbox" name="filter-pass-type" value="epic" /> Epic <span data-pass-count="epic"></span></label>
        </div>
        <div class="filter-group">
          <div class="filter-group-title">Region</div>
          <div id="filter-region-options" class="filter-option-grid filter-option-list" role="group" aria-label="Region filters"></div>
        </div>
        <div class="filter-actions">
          <button id="filter-reset-btn" type="button">Reset</button>
          <button id="filter-close-btn" type="button">Close</button>
        </div>
      </div>
    </div>
    <div id="page-content-root" data-loading="1">
      {{page_shell_placeholder}}
    </div>
  </main>
  <footer class="page-footer">
    <span><strong>CloseSnow</strong> · <a href="https://ljcc0930.github.io/" target="_blank" rel="noopener noreferrer">ljcc</a></span>
    <a href="https://github.com/ljcc0930/CloseSnow/issues/new?template=feature_request.yml" target="_blank" rel="noopener noreferrer">Request a feature</a>
  </footer>
  <script>
    window.CLOSESNOW_FILTER_META = {{filter_meta_json}};
    window.CLOSESNOW_PAGE_BOOTSTRAP = {{page_bootstrap_json}};
    window.CLOSESNOW_INITIAL_PAYLOAD = {{initial_payload_json}};
  </script>
  <script src="assets/js/weather_code_emoji.js"></script>
  <script src="assets/js/weather_colors.js"></script>
  <script src="assets/js/compact_daily_summary.js"></script>
  <script src="assets/js/weather_filter_state.js"></script>
  <script src="assets/js/sticky_single_table_layout.js"></script>
  <script src="assets/js/weather_page_formatters.js"></script>
  <script src="assets/js/weather_report_model.js"></script>
  <script src="assets/js/snow_timeline.js"></script>
  <script src="assets/js/weather_icons.js"></script>
  <script src="assets/js/timeline_scroller.js"></script>
  <script src="assets/js/weather_sections.js"></script>
  <script src="assets/js/weather_table_layout.js"></script>
  <script src="assets/js/weather_page.js"></script>
</body>
</html>
